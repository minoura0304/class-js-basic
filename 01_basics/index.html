<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_basics</title>
</head>

<body>
    <h1>JavaScript基礎</h1>
    <p>開発者ツールのConsole（コンソール）を開いて結果を確認してください。</p>
    <script>
        //１行コメント
        /*複
        数行コメント
        */
        console.log('js!', 123);
        console.warn('warn');
        console.error('error');
        console.table(['apple', 'banana']);

        let name;
        console.log(name);
        name = 'minoura';
        console.log(name);

        console.log(6 + 9);
        console.log(10 - 15);
        console.log(3 * 7);
        console.log(10 / 5);
        console.log(7 % 3);// 割った時のあまり
        console.log(3 ** 2);

        let x = 1;
        x = x + 1;

        /*
        x＋１だけでは変数の値は変わらない。
        必ず、計算した結果をだ隠喩数r必要がある
        */
        console.log(x);

        x += 100;
        console.log(x);

        x--;
        console.log(x);

        console.log(typeof x);
        console.log(x + 'px');

        const person = `takagi`;
        const points = 120;
        console.log(`こんにちは、${person}さん。点数は${points}です。`);
    </script>
</body>

</html>
